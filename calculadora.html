<!DOCTYPE html>
<html lang="pt-br">
<head> 
<link rel="stylesheet" href="style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas</title>
</head>
<body> 


    <div class="container">
        <h1> Calculadora de Notas </h1>

        <div class="quadrado">
   <label for="nota"> Digite uma nota: </label>
        <div class="input-inbox">
            <input type="number" id="nota" min="0" max="10" step="0.01" placeholder="Ex: 8.5">
            <button onclick="adicionarNota()">Adicionar</button>
        </div>
    </div>
    <div class="quadrado">
        <h2>Notas Inseridas</h2>
        <ul id="listaNotas"></ul>
        <button class="btn-limpar" onclick="limparHistorico()">Limpar Histórico</button>
</div>
      </div>

      <div class="quadrado">
        <button class="btn-media" onclick="mostrarMedia()">Calcular Média</button>
        <p id="result">adicione para começar</p>
        <p id="media"></p>
      </div>
    </div>
    <script src="teste.js"></script>
</body> 
</html>
